<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Whisper Transcribe</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 60px auto; padding: 0 16px; }
  pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; word-break: break-word; }
  button { margin-top: 10px; padding: 8px 16px; }
</style>
</head>
<body>
  <h1>Whisper Transcribe</h1>
  <input type="file" id="audio" accept="audio/*">
  <br>
  <button id="submit">Transcribe</button>
  <pre id="result"></pre>

<script>
  const BACKEND_URL = "https://fastapi-sst.onrender.com/transcribe";

  document.getElementById("submit").addEventListener("click", async () => {
    const file = document.getElementById("audio").files[0];
    const result = document.getElementById("result");

    if (!file) {
      result.textContent = "Pick an audio file first.";
      return;
    }

    result.textContent = "Transcribing...";

    const formData = new FormData();
    formData.append("audio", file);

    try {
      const res = await fetch(BACKEND_URL, { method: "POST", body: formData });
      const data = await res.json();
      result.textContent = JSON.stringify(data, null, 2);
    } catch (err) {
      result.textContent = "Request failed: " + err;
    }
  });
</script>
</body>
</html>
